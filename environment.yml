# conda/micromamba environment for fishsim (simulation, system-identification fits, RL training, paper figures)
#   micromamba env create -f environment.yml && micromamba activate fishsim
# The paper figures additionally need a LaTeX with dvipng (matplotlib usetex, package mathptmx) and,
# for the three SVG figures, Inkscape or Chrome/Edge.
name: fishsim
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - mujoco==3.3.1
      - gymnasium==1.1.1
      - stable-baselines3==2.6.0
      - torch==2.6.0
      - numpy==2.2.4
      - scipy==1.15.2
      - pandas==2.3.0
      - matplotlib==3.10.1
      - pyyaml==6.0.2
      - opencv-python==4.11.0.86
      - imageio==2.37.0
      - tqdm==4.67.1
      - cma==4.4.4                  # CMA-ES for the fluid fit (sysid/fluid/opt_field2sim.py)
      - bayesian-optimization==2.0.3
      - wandb==0.26.0               # sweeps and run logging (rl/opt_hyperRL.py)
      - pikepdf                     # paper/tools/compress_figures.py
      - pytest
