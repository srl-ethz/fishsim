project: fishsim
entity: srl_ethz
name: sofi_da_lpf_refitB

# DA-MotorID + 4.5 Hz setpoint LPF, refitB fluid (A/B partner: sweep_da_lpf_e13a).
# Motivation (2026-06-25): without an LPF the DA policy commands >5 Hz setpoints
# (65% of power, 44% >8 Hz) the joint-damped motor can't track, producing tiny fast
# tail flutter that the velocity²-scaled fluid coeffs turn into non-physical thrust
# (fish moves ~1.3 m with almost no tail motion). The 4.5 Hz 1st-order setpoint LPF
# removes the high-freq command (cuts >8 Hz content 46%→3%), forcing realistic,
# low-frequency, large-amplitude strokes in the band where the fluid was tuned (≤4 Hz).
# Everything else = the canonical DA recipe (re-ID joint-damping motor + refitB fluid +
# 10-stage curriculum). See CANONICAL_POLICIES.md and the LPF restore in env_sofi_da.py.

method: bayes
metric:
  name: curriculum/stage
  goal: maximize
run_cap: 6

parameters:
  env:
    value: sofi_full_curriculum_da          # refitB fluid (generator default)

  # ── Setpoint low-pass filter (the change vs sweep_da.yml) ───────────────────
  lpf_cutoff_hz:
    value: 4.5

  nSteps:
    value: 3000000
  maxEpisodeSteps:
    value: 2000

  # ── Network ───────────────────────────────────────────────────────────────
  hiddenDim:
    distribution: int_uniform
    min: 280
    max: 350
  numLayers:
    value: 3

  # ── Optimiser ─────────────────────────────────────────────────────────────
  learningRate:
    distribution: log_uniform_values
    min: 1.2e-4
    max: 1.5e-4
  batchSize:
    value: 256

  # ── SAC ───────────────────────────────────────────────────────────────────
  gamma:
    distribution: uniform
    min: 0.992
    max: 0.997
  tau:
    distribution: uniform
    min: 0.003
    max: 0.007
  train_freq:
    value: 4
  learningStarts:
    distribution: int_uniform
    min: 3700
    max: 5000
  lr_scale:
    value: 0.60

  # ── Motor model ───────────────────────────────────────────────────────────
  motor_deadtime_steps:
    value: 14
  motor_ctrlrange:
    value: 1.0

  # ── Reward: CPG-style (distance + success) ─────────────────────────────────
  use_distance_reward:
    value: true
  rewardSuccess:
    value: 1000.0
  alpha_jerk:
    value: 0.0
  alpha_heading:
    value: 0.0
  alpha_backward:
    value: 0.0
  alpha_fwd:
    value: 0.0
  backward_vel_limit:
    value: 0.0

  # ── Hardware / sim parameters ─────────────────────────────────────────────
  success_radius:
    value: 0.1
  camera_fps:
    value: 53.18
  mirror_replay_buffer:
    value: true

  # ── Evaluation ────────────────────────────────────────────────────────────
  eval_freq:
    value: 50000
  eval_freq_early:
    value: 200000
  n_eval_episodes:
    value: 100
