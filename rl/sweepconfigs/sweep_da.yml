project: fishsim
entity: srl_ethz
name: sofi_da_rl_policy

# Direct Action, sim2real-fixed model (2026-06-20). Two changes vs S01:
#  1. MOTOR: joint-damping back-EMF model (23_motor_id.py kv-free fit, 2026-06-19) —
#     kp=5.41, kv=0, armature=0.0113, JOINT DAMPING b=0.48 (outside the actuator clip →
#     hard velocity cap ~4.8 rad/s, was 11 rad/s uncapped). dead-time 14 ms (DR 8–18).
#  2. FLUID: refitB_fwdonly coeffs in auto_SOFI.py — re-ID'd with an explicit backward-
#     swimming penalty (val_loss 0.164, best yet) → FORBIDS backward swimming (verified
#     on 3 captured gaits; new motor × refitB = forward). Fixes the S01 backward exploit.
# Motor DR (kp/kv/dead-time) recentred in env_sofi_full_curriculum_da; v_max DR'd
# via forcerange (voltage-sag coupled). Fresh from-scratch SAC, same 10-stage curriculum.
# See memory project_sim2real_motorfix_sweep + fluidID/results/refitB_fwdonly/.

method: bayes
metric:
  name: curriculum/stage
  goal: maximize
run_cap: 20

parameters:
  env:
    value: sofi_full_curriculum_da

  nSteps:
    value: 3000000
  maxEpisodeSteps:
    value: 2000

  # ── Network ───────────────────────────────────────────────────────────────
  hiddenDim:
    distribution: int_uniform
    min: 280
    max: 350
  numLayers:
    value: 3

  # ── Optimiser ─────────────────────────────────────────────────────────────
  learningRate:
    distribution: log_uniform_values
    min: 1.2e-4
    max: 1.5e-4
  batchSize:
    value: 256

  # ── SAC ───────────────────────────────────────────────────────────────────
  gamma:
    distribution: uniform
    min: 0.992
    max: 0.997
  tau:
    distribution: uniform
    min: 0.003
    max: 0.007
  train_freq:
    value: 4
  learningStarts:
    distribution: int_uniform
    min: 3700
    max: 5000
  lr_scale:
    value: 0.60

  # ── Motor model ───────────────────────────────────────────────────────────
  # kp/kv/armature/joint-damping come from the XML (auto_SOFI.py) + per-stage motor DR
  # (kp/kv/dead-time/forcerange recentred in env_sofi_full_curriculum_da).
  # b (joint damping) + armature are XML-fixed (not DR'd). Dead-time nominal here; DR'd
  # 8–18 ms per-episode by the curriculum stages.
  motor_deadtime_steps:
    value: 14
  motor_ctrlrange:
    value: 1.0

  # ── Reward: CPG-style (2 terms only) ──────────────────────────────────────
  # Backward is now forbidden by the fluid coeffs + velocity cap, so no reward guard
  # needed — keep pure distance + success. (Add backward_vel_limit later if eval shows any.)
  use_distance_reward:
    value: true
  rewardSuccess:
    value: 1000.0
  alpha_jerk:
    value: 0.0
  alpha_heading:
    value: 0.0
  alpha_backward:
    value: 0.0
  alpha_fwd:
    value: 0.0
  backward_vel_limit:
    value: 0.0

  # ── Hardware / sim parameters ─────────────────────────────────────────────
  success_radius:
    value: 0.1
  camera_fps:
    value: 53.18
  mirror_replay_buffer:
    value: true

  # ── Evaluation ────────────────────────────────────────────────────────────
  eval_freq:
    value: 50000
  eval_freq_early:
    value: 200000
  n_eval_episodes:
    value: 100
